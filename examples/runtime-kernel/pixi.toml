[workspace]
name = "runtime-kernel-reference"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
build = "rustc --edition=2021 -O main.rs -o /tmp/fieldnotes-runtime-kernel"
demo = "rustc --edition=2021 -O main.rs -o /tmp/fieldnotes-runtime-kernel && /tmp/fieldnotes-runtime-kernel"
test = "rustc --edition=2021 --test main.rs -o /tmp/fieldnotes-runtime-kernel-tests && /tmp/fieldnotes-runtime-kernel-tests"

[dependencies]
rust = "*"
